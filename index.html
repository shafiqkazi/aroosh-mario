<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroosh Mario</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b1630;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Fredoka',sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:contain;display:block}
.btn{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.85);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;background:rgba(20,40,90,.6);box-shadow:0 2px 6px rgba(0,0,0,.4);font-family:inherit}
#pad{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px}
.btn:active,.btn.on{transform:scale(.92);background:rgba(255,255,255,.35)}
#b{background:radial-gradient(circle at 35% 30%,#7ab8ff,#1f5fd0)}
#a{background:radial-gradient(circle at 35% 30%,#ff8a7a,#e0261b)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,20,50,.72);color:#fff;text-align:center;gap:10px;padding:20px}
#ov h1{margin:0;font-size:clamp(30px,7vw,56px);text-shadow:0 4px 0 #c0392b}
#ov p{margin:0;font-size:clamp(16px,3.5vw,22px);opacity:.95}
#go{margin-top:12px;font-family:inherit;font-size:26px;font-weight:700;padding:12px 40px;border:0;border-radius:40px;color:#fff;background:linear-gradient(#ffb340,#f26b1d);box-shadow:0 6px 0 #a8430f,0 10px 20px rgba(0,0,0,.4)}
</style></head><body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="pad"><div class="btn" id="a">A</div><div class="btn" id="b">B</div><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div>
<div id="ov"><h1 id="t">Aroosh Mario</h1><p id="m">Press ▶ to go forward and ◀ to turn and go back. Bombs fly the way you face.<br>Red <b>A</b> = throw bomb (you start with 10; each coin gives +1), blue <b>B</b> = jump (land on enemies to squash them)!<br>Collect gold coins — missing them costs points!<br>Beat all 10 rounds and reach the Queen 👑</p><button id="go">Start Game</button></div>
